name: CI

# 每次 push / PR / 手动触发都跑同一套门禁：单测（强制重跑）、lint、中英文案对齐、版本号一致性。
# 检查步骤写在 .github/actions/checks 里；首个 job 失败时自动换一台运行器重试一次，两次都失败才算红
# （2026-11-27：依赖仓库的解析会间歇失败，同一提交重跑即过——只在同一个任务里重试不一定管得够）。
# 只发布不维护签名：这里不构建 release 包（签名口令不进 CI）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 首个 job 失败不让整次运行直接判红，结果写进输出，交给下面的重试 job 决定。这里必须用步骤级
  # continue-on-error：任务级的会把结果直接报成成功，重试条件永远不成立（2026-11-27 踩过）。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      failed: ${{ steps.verdict.outputs.failed }}
    steps:
      - uses: actions/checkout@v4   # 本地组合动作要先检出仓库才找得到
      - id: checks
        continue-on-error: true
        uses: ./.github/actions/checks
        with:
          reports-name: reports
      - id: verdict
        if: always()
        run: echo "failed=${{ steps.checks.outcome != 'success' }}" >> "$GITHUB_OUTPUT"

  checks-retry:
    needs: checks
    if: needs.checks.outputs.failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checks
        with:
          reports-name: reports-retry
