name: CI

# 每次 push / PR / 手动触发都跑同一套门禁：单测（强制重跑）、lint、中英文案对齐、版本号一致性。
# 只发布不维护签名：这里不构建 release 包（签名口令不进 CI）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 运行器自带 sdkmanager，不用第三方的 setup-android：它替人接受 SDK 许可时只答固定条数，
      # 未接受的许可一多（2026-11-27 首次运行时有 7 条）就以退出码 1 失败。这里全部接受；缺的平台与构建工具由 Gradle 自己下载。
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 依赖仓库的可达性：2026-11-27 有两次运行在解析 Kotlin 插件时被判「找不到」，重跑即过；记录状态码与出口 IP 便于定位
      - name: Repository reachability
        run: |
          for u in "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/maven-metadata.xml"
                   "https://plugins.gradle.org/m2/org/jetbrains/kotlin/kotlin-stdlib/maven-metadata.xml"
                   "https://dl.google.com/dl/android/maven2/androidx/core/core/maven-metadata.xml"; do
            curl -sS -o /dev/null -m 30 -w "%{http_code} %{remote_ip} %{time_total}s $u\n" "$u" || echo "FAILED $u"
          done
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (always re-run)
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks --no-configuration-cache --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-configuration-cache --stacktrace

      - name: String parity (zh = en, placeholders match)
        run: python3 scripts/check_strings.py

      - name: Version consistency (build.gradle / CHANGELOG / local notes when present)
        run: bash scripts/check_doc_sync.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
