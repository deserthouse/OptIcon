name: CI

# 每次 push / PR / 手动触发都跑同一套门禁：单测（强制重跑）、lint、中英文案对齐、版本号一致性。
# 检查步骤写在 .github/actions/checks 里；首个 job 失败时自动换一台运行器重试一次，两次都失败才算红
# （2026-11-27：依赖仓库的解析会间歇失败，同一提交重跑即过——只在同一个任务里重试不一定管得够）。
# 只发布不维护签名：这里不构建 release 包（签名口令不进 CI）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # continue-on-error：首个 job 失败不让整次运行直接判红，交给下面的重试 job 决定
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: ./.github/actions/checks
        with:
          reports-name: reports

  checks-retry:
    needs: checks
    if: needs.checks.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: ./.github/actions/checks
        with:
          reports-name: reports-retry
